[project]
name = "lcode-server"
version = "0.1.0"
description = "LCode 后端服务：FastAPI + SQLAlchemy 2.0 异步 + PostgreSQL（wire 契约见 contracts/）"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]==0.136.3",
    "sqlalchemy[asyncio]==2.0.50",
    "asyncpg==0.31.0",
    "pydantic-settings==2.16.0",
    "alembic==1.20.0",
    # 统一日志体系（基座铁律 11 / NFR-007）：版本钉死对齐全局技能 python-backend-base
    # 第四轮基线（2026-10-17 课程 18 章「日志」），core/logger/ 是日志唯一配置处。
    "loguru==0.7.3",
    # 契约单源（ADR-003）：workspace 成员 + editable 安装，锁文件里带上契约包的依赖
    # （pydantic）；`import lcode_contracts` 由 venv 解析（不再依赖 PYTHONPATH 路径口径）。
    "lcode-contracts",
    # 沙箱 SDK 版本**钉死**（AGENTS.md 硬约束 1）：更高的 e2b 版本创建百炼沙箱实例
    # 会返回 405；升级必须先过 sandbox 适配层回归（M2 任务 4 才真正使用这两个依赖）。
    "e2b==2.31.0",
    "e2b-code-interpreter==2.8.1",
    # Agent 运行时栈（M2 任务 3 起）：版本钉死（项目约定 `==`，uv 解析后收窄范围语法）。
    # deepagents 钉 0.6.12：本地参考快照为 0.7.25，但 0.7.x 与 e2b==2.31.0（硬约束 1，
    # 不可动）存在传递依赖冲突，本约束集下不可装——以实际可装版本为准；升级须过装配层回归。
    "langchain==1.4.6",
    "langchain-core==1.6.12",
    # 模型客户端（ADR-007）：ChatAnthropic 直连 Anthropic Messages 兼容网关，保留
    # thinking/signature（源思维链）。ChatOpenAI 的 OpenAI 兼容路径已移除（其转换层
    # 丢弃 reasoning_content，源码实测）。deepagents 亦传递依赖本包，此处显式钉
    # 1.7.6（round-trip 回归锚：test/unit/test_anthropic_thinking.py）。
    "langchain-anthropic==1.7.6",
    "langgraph==1.2.16",
    "langgraph-checkpoint-postgres==3.2.0",
    "deepagents==0.6.12",
    "pyyaml==6.0.3",
    "opensandbox==1.1.1",
]

[tool.uv.sources]
# 契约包是 workspace 成员（根 pyproject 的 members）；workspace 源 = uv 官方口径的
# 「成员间依赖」声明方式（path 源与成员身份互斥，uv 会显式报错）。
lcode-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# 把 app/ 打包进服务，使 `uv run --package lcode-server python -c "import app.main"` 可用
[tool.hatch.build.targets.wheel]
packages = ["app/"]

# 开发/测试依赖（不随生产安装）：三层测试（unit/integration/e2e）与调试
# httpx = 自写测试用（ASGITransport / e2e 轮询）；httpx2 = starlette TestClient 的首选后端
# （缺 httpx2 时回退 httpx 并给出弃用告警，故两者都锁进 dev 组）
[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
    "httpx2==2.13.1",
    "python-dotenv==1.2.4",
    "debugpy==1.8.22",
    "psycopg2-binary==2.9.13",
    "types-pyyaml==6.0.12.20250809",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# 显式豁免标记（test-plan §1.4）：requires_llm = 真模型冒烟，需 LLM_BASE_URL 非空且
# LLM_API_KEY_ENV 指向的变量已设值；不进 M2 出口门禁，缺环境时显式 skip（非失败）。
markers = [
    "requires_llm: 真模型冒烟（需网关地址与密钥），不进 M2 出口门禁（test-plan §1.4/§3.2）",
    "requires_db: 需要真实 PostgreSQL（.env.test 的 DB_*）；库不可达或 DB_NAME 非 _test 时整层显式 skip（conftest 打 reason）",
    "requires_sandbox: 真百炼沙箱冒烟（需 BAILIAN_API_KEY 与 SANDBOX_BAILIAN_TEMPLATE），缺凭证显式 skip（test-plan §1.4）",
    "requires_sandbox_opensandbox: 真自托管 OpenSandbox 冒烟（需 SANDBOX_OPENSANDBOX_ENDPOINT），未部署显式 skip（test-plan §1.4）",
]
# -ra：显式 skip（requires_* 缺环境）的 reason 汇总可见——缺基础设施不红，但也不静默消失
addopts = "-ra"
# 契约包已以 **editable** 方式进入 workspace 共享 venv（contracts 是可安装的 workspace
# 成员，见 contracts/pyproject.toml 的 [build-system]）：`import lcode_contracts` 由 venv
# 直接解析，测试不再需要 `pythonpath` 兜底——三层测试/dev/e2e 的 import 语义由此统一。
