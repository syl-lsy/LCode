# LCode CI —— 里程碑环（调研报告 docs/research/github-actions-ci.md §4.1 方案 A「每次全跑」）
#
# 原则：
# - 步骤只调根 Makefile 目标（单一事实源），不在 yml 里复制命令；
# - 两 job 并行：backend（contracts + ruff/mypy + test 覆盖门禁 + e2e）/
#   frontend（frozen install + eslint + tsc + vitest + vite build）；
# - 只跑 ubuntu-latest：Free 私有仓库 2000 分钟/月，Linux 即基准费率；勿加 macOS
#   （P2 Electron 引入前必须重查费率口径，报告 §6.2）；
# - .env.test 自举在 Makefile 目标内完成（test -f || cp 模板），干净 checkout 无需额外步骤；
# - M1 的 CI 不需要任何 secrets（报告 §2.2）；G4 起 backend job 带 postgres:18 service
#   （dummy 凭据仅 job 生命周期），integration/e2e 的 DB 实跑；requires_llm/requires_sandbox
#   类豁免缺依赖显式跳过，skip 预算由 scripts/check_skips.py 门禁兜住（G3）；
# - 分支保护（required status checks）GitHub Free 私有仓库不生效——本 workflow 先做
#   advisory 红叉自查，升 Pro 与否留 P2 一起决策（报告 §4.2）。

name: CI

on:
  push:
    branches: [main] # 直接推 main / PR 合并后触发
  pull_request: # PR 每次更新触发（feature 分支 push 不重复触发）
  workflow_dispatch: # 手动兜底

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true # 同分支新提交取消旧 run，省配额

jobs:
  backend: # Python 3.14 + uv workspace（apps/server/ + contracts/）
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # G4（M2 收口台账）：integration/e2e 需要真 PostgreSQL——postgres service 就绪后
    # make test / test-e2e / db-check 全部实跑（e2e 坏配置会红，不许假绿 skip）。
    # 凭据为 CI dummy（仅本次 job 生命周期，非真实密钥）。DB_USER=postgres 是
    # superuser：e2e conftest 走 createdb/dropdb 需要 CREATEDB 权限，
    # 且库名固定 lcode_e2e_test / integration 用 .env.test 的 lcode_test（互不干扰）。
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-dummy-pg
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    # job env 注入 DB_ 配置组：Makefile 会从模板自举 .env.test（DB_USER=lcode 等），
    # 但 conftest 的 load_dotenv(override=False) 保证这里的真实环境变量**优先**——
    # 这正是 e2e 负控（DB_PORT 覆盖）依赖的同一优先级口径。
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: lcode_test
      DB_USER: postgres
      DB_PASSWORD: ci-dummy-pg
    steps:
      - uses: actions/checkout@v7

      - name: 安装 uv（Python 3.14 + 依赖缓存）
        # 钉具体版本：setup-uv 的 v8+ 没有发布浮动 major tag（v10/v9/v8 均解析不到），
        # 写 @v10 会让 job 在 Set up job 的 Prepare actions 阶段整 job 失败（2026-10-17 首跑实测）。
        uses: astral-sh/setup-uv@v10.3.0
        with:
          # 与根 .python-version / apps/server requires-python>=3.14 对齐（报告骨架的 "3.12" 是占位，此处定稿）
          python-version: "3.14"
          enable-cache: true # 默认 auto（有 uv.lock 即开），显式声明更清晰
          cache-dependency-glob: uv.lock # 根单锁文件，哈希变才换缓存 key

      - name: 安装 Node（contracts TS harness 需要）
        # 理由：make contracts = pytest harness + ts-check.sh（TS 生成/tsc/in-sync 守门），
        # ts-check.sh 要求 node>=20 且 node 不可用时**显式失败**——backend job 必须带 node。
        # 定稿=本地开发同代 v24（volta；Node Active LTS）。报告骨架的 "22" 为占位。
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: 质量门禁（make ci-backend = contracts + ruff/mypy + test 覆盖门禁 + e2e）
        run: make ci-backend

      # M2+ 可选（骨架期不启用，省 Free 的 500MB artifacts 额度）：失败时上传覆盖率报告
      # - uses: actions/upload-artifact@v6
      #   if: failure()
      #   with: { name: backend-coverage, path: htmlcov/, retention-days: 7 }

  frontend: # React + TS + Vite + pnpm（web/）
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # 顺序铁律：pnpm/action-setup 必须在 setup-node 之前（缓存解析 pnpm store 路径，报告 §5.3）
      - name: 安装 pnpm（版本取 packageManager 字段：pnpm@10.33.4）
        uses: pnpm/action-setup@v6
        with:
          # 仓库根无 package.json（uv workspace 虚拟根 + npm 工程在 web/），显式指到 web/
          package_json_file: web/package.json

      - name: 安装 Node（pnpm store 缓存，key 由 web/pnpm-lock.yaml 派生）
        uses: actions/setup-node@v7
        with:
          node-version: 24 # 与本地开发（volta v24）同代；web engines 要求 >=22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # G1（M2 收口台账）起前端挂覆盖率硬门禁：ci-frontend 内 make test-web =
      # `vitest run --coverage`，阈值见 web/vite.config.ts（2026-10-19 按实测基线定档：
      # lines 90 / statements 85 / functions 85 / branches 80，src/events 单列 ≥90）。
      - name: 质量门禁（make ci-frontend = frozen install + eslint + tsc + vitest + vite build）
        run: make ci-frontend
